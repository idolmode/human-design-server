<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Human Design BodyGraph</title>
<style>
*{box-sizing:border-box}html,body{margin:0;background:#fff;color:#151515;font-family:Arial,Helvetica,sans-serif}body{min-width:320px}.page{max-width:1500px;margin:0 auto;padding:14px 18px 34px}.top{display:grid;grid-template-columns:330px 1fr 330px;align-items:start;gap:10px}.side-title{font-size:30px;font-weight:800;line-height:1}.side-sub{font-size:14px;margin-top:5px}.design{color:#df2637}.personality{color:#111;text-align:right}.title{text-align:center}.title h1{margin:0;font-size:27px}.birth{color:#68758b;font-size:12px;margin-top:5px}.chart-wrap{margin:2px auto 0;max-width:1386px}.chart-wrap svg{display:block;width:100%;height:auto}.info{display:grid;grid-template-columns:repeat(3,1fr);max-width:900px;margin:8px auto 0;border:1px solid #dce2ea;border-radius:16px;overflow:hidden}.card{text-align:center;padding:12px 16px;border-right:1px solid #dce2ea}.card:last-child{border-right:0}.label{color:#748096;font-size:11px}.value{font-size:18px;font-weight:800;margin-top:4px}.meta{text-align:center;color:#68758b;font-size:11px;margin:8px auto 0;line-height:1.4}.loading{text-align:center;padding:100px 20px;color:#718096}.error{max-width:760px;margin:60px auto;padding:18px 20px;background:#fff0f0;border:1px solid #ffd0d0;border-radius:12px;color:#9f1d2b}.planet{font-size:16px;font-weight:700}.gate{font-size:11px}.center-label{font-size:12px;font-weight:800;fill:#303642;letter-spacing:.2px}.mini{font-size:10px;fill:#657186}@media(max-width:900px){.top{grid-template-columns:1fr;text-align:center}.design,.personality{text-align:center}.side-title{font-size:22px}.side-sub{font-size:12px}.info{grid-template-columns:1fr}.card{border-right:0;border-bottom:1px solid #dce2ea}.card:last-child{border-bottom:0}}
</style>
</head>
<body>
<main class="page">
  <div class="top">
    <div><div class="side-title design">DESIGN</div><div class="side-sub design">The Unconscious</div></div>
    <div class="title"><h1>Ваш BodyGraph</h1><div class="birth" id="birth"></div></div>
    <div><div class="side-title personality">PERSONALITY</div><div class="side-sub personality">The Conscious</div></div>
  </div>
  <div id="chart" class="chart-wrap"><div class="loading">Загрузка...</div></div>
  <div class="info">
    <div class="card"><div class="label">Тип</div><div class="value" id="type">—</div></div>
    <div class="card"><div class="label">Авторитет</div><div class="value" id="authority">—</div></div>
    <div class="card"><div class="label">Профиль</div><div class="value" id="profile">—</div></div>
  </div>
  <div id="meta" class="meta"></div>
</main>
<script>
const params=new URLSearchParams(location.search);
const date=params.get('date'),time=params.get('time'),timezone=params.get('timezone');
if(!date||!time||!timezone)showError('Необходимо указать date, time и timezone в URL.');
else{document.getElementById('birth').textContent=`${date} ${time} · ${timezone}`;fetch(`/api/chart?date=${encodeURIComponent(date)}&time=${encodeURIComponent(time)}&timezone=${encodeURIComponent(timezone)}`).then(async r=>{const d=await r.json().catch(()=>({}));if(!r.ok)throw new Error(d.error||'Ошибка API');return d}).then(draw).catch(e=>showError('Не удалось загрузить карту: '+e.message));}
function showError(s){document.getElementById('chart').innerHTML=`<div class="error">${esc(s)}</div>`}
function esc(s){return String(s??'').replace(/[&<>\"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;','\\':'&#92;'}[c]))}

// v8: fixed gate anchoring based on the supplied reference screenshot.
const CENTER_ORDER=['head','ajna','throat','g','heart','spleen','sacral','solarplexus','root'];
const CENTER_GATES={head:[64,61,63],ajna:[47,24,4,17,11,43],throat:[62,23,56,16,35,12,45,8,31,33,20],g:[1,7,13,25,10,15,2,46],heart:[21,26,40,51],spleen:[48,57,44,50,32,28,18],sacral:[5,14,29,34,9,59,3,27,42],solarplexus:[6,37,22,36,49,55,30],root:[53,60,52,19,39,41,38,54,58]};
const CENTER_NAMES={head:'ГОЛОВА',ajna:'АДЖНА',throat:'ГОРЛО',g:'G-ЦЕНТР',heart:'ЭГО',spleen:'СЕЛЕЗЁНКА',sacral:'САКРАЛ',solarplexus:'СОЛНЕЧНОЕ СПЛЕТЕНИЕ',root:'КОРЕНЬ'};
// Larger, fixed composition: coordinates are intentionally stable so gates never move over channels.
const CENTER_POS={
 head:{x:618,y:158,w:118,h:104,type:'head'},
 ajna:{x:618,y:268,w:128,h:116,type:'tri'},
 throat:{x:618,y:421,w:132,h:128,type:'throat'},
 g:{x:618,y:592,w:145,h:166,type:'diamond'},
 heart:{x:757,y:704,w:92,h:88,type:'circle'},
 spleen:{x:401,y:823,w:118,h:148,type:'tri'},
 sacral:{x:618,y:819,w:145,h:148,type:'sacral'},
 solarplexus:{x:858,y:820,w:145,h:138,type:'tri'},
 root:{x:618,y:1001,w:150,h:148,type:'root'}
};
// Gate positions are inside the centers but away from channel corridors.
const GATE_ANCHORS={
 head:[[590,156],[618,156],[645,156]],
 ajna:[[590,226],[618,226],[645,226],[599,274],[637,274],[618,299]],
 throat:[[589,369],[618,369],[646,369],[583,397],[650,397],[651,423],[648,448],[618,472],[589,472],[646,472],[561,423]],
 g:[[618,548],[592,570],[645,570],[670,608],[566,608],[592,641],[645,641],[618,666]],
 heart:[[770,679],[727,704],[758,733],[770,694]],
 spleen:[[367,770],[385,792],[405,803],[425,820],[404,839],[386,856],[368,878]],
 sacral:[[604,770],[618,766],[635,770],[602,802],[646,809],[601,839],[604,866],[618,866],[637,852]],
 solarplexus:[[858,770],[845,796],[828,818],[828,818],[845,844],[862,862],[864,885]],
 root:[[595,957],[618,957],[641,958],[641,980],[595,986],[641,1006],[595,1008],[641,1028],[595,1031]]
};
const PLANET_SYMBOL={sun:'☉',earth:'⊕',moon:'☽',north_node:'☊',south_node:'☋',mercury:'☿',venus:'♀',mars:'♂',jupiter:'♃',saturn:'♄',uranus:'♅',neptune:'♆',pluto:'♇'};
const PLANET_ORDER=['sun','earth','north_node','south_node','moon','mercury','venus','mars','jupiter','saturn','uranus','neptune','pluto'];
function normalizeActivations(hd){return{personality:Array.isArray(hd.activations?.personality)?hd.activations.personality:[],design:Array.isArray(hd.activations?.design)?hd.activations.design:[]}}
function gateIsActive(hd,g){return new Set((hd.activatedGates||[]).map(Number)).has(Number(g))}
function definedChannelList(hd){return Array.isArray(hd.definedChannels)?hd.definedChannels.map(c=>typeof c==='string'?{key:c,name:''}:c).filter(c=>c&&c.key):[]}
function normalizeKey(k){return String(k||'').replace(/\s+/g,'').replace(/[–—]/g,'-')}
function channelKey(c){return normalizeKey(c.key||c.channel||c.name)}
function draw(data){
 try{
  const hd=data?.humanDesign||{};const active=new Set((hd.activatedGates||[]).map(Number));const defined=new Set(hd.definedCenters||[]);const chans=definedChannelList(hd);const acts=normalizeActivations(hd);
  document.getElementById('type').textContent=hd.type||'—';document.getElementById('authority').textContent=hd.authority||'—';document.getElementById('profile').textContent=hd.profile||'—';
  let s=`<svg viewBox="0 0 1386 1100" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Human Design BodyGraph">`;
  s+=`<rect width="1386" height="1100" fill="#fff"/>`;
  // Soft human silhouette and concentric guide rings, inspired by the reference composition.
  s+=`<path d="M520 54 Q693 -5 866 54 Q808 112 823 205 Q925 290 950 430 L986 690 Q995 900 884 1055 L502 1055 Q391 900 400 690 L436 430 Q461 290 563 205 Q578 112 520 54Z" fill="#eef1f7"/>`;
  s+=`<ellipse cx="693" cy="610" rx="300" ry="405" fill="none" stroke="#fff" stroke-width="12"/><ellipse cx="693" cy="610" rx="258" ry="355" fill="none" stroke="#fff" stroke-width="8"/>`;
  s+=sideColumn(acts.design,96,'#df2637','left');s+=sideColumn(acts.personality,1260,'#111','right');
  s+=`<g font-family="Arial,Helvetica,sans-serif"><text x="315" y="92" fill="#df2637" font-size="23" font-weight="700">L</text><path d="M350 85 H420" stroke="#df2637" stroke-width="14"/><path d="M350 85 l20 -16 v32z" fill="#df2637"/><text x="1070" y="92" fill="#111" font-size="23" font-weight="700">R</text><path d="M965 85 H1035" stroke="#111" stroke-width="14"/><path d="M1035 85 l-20 -16 v32z" fill="#111"/></g>`;
  // Channels: anchored to the fixed gate positions, then routed through clean corridors.
  for(const c of chans){const k=channelKey(c);let path=null,label='';if(k==='9-52'){path=`M 637 852 C 670 885 675 930 641 980`;label='9–52';}else if(k==='30-41'){path=`M 864 885 C 925 920 900 975 641 1006`;label='30–41';}else continue;const gates=(c.gates||[]).map(Number);const red=gates.length>=2?active.has(gates[0])&&active.has(gates[1]):true;s+=`<path d="${path}" fill="none" stroke="#fff" stroke-width="22" stroke-linecap="round"/><path d="${path}" fill="none" stroke="${red?'#df2637':'#111'}" stroke-width="10" stroke-linecap="round"/>`;if(k==='9-52')s+=`<text x="730" y="920" class="mini" font-weight="700">${label}</text>`;else s+=`<text x="900" y="970" class="mini" font-weight="700">${label}</text>`}
  for(const name of CENTER_ORDER){const p=CENTER_POS[name];s+=centerShape(p,defined.has(name)?centerColor(name):'#fff')}
  for(const name of CENTER_ORDER){const p=CENTER_POS[name];s+=`<text x="${p.x}" y="${p.y+3}" text-anchor="middle" dominant-baseline="middle" class="center-label">${CENTER_NAMES[name]}</text>`}
  for(const name of CENTER_ORDER){const gates=CENTER_GATES[name],slots=GATE_ANCHORS[name];gates.forEach((g,i)=>{const q=slots[i];const on=active.has(g);s+=`<g><circle cx="${q[0]}" cy="${q[1]}" r="${on?15:11}" fill="${on?'#6d3b95':'#fff'}" stroke="${on?'#6d3b95':'#aeb6c2'}" stroke-width="${on?1:1.4}"/><text x="${q[0]}" y="${q[1]+1}" text-anchor="middle" dominant-baseline="middle" class="gate" fill="${on?'#fff':'#2e3440'}">${g}</text></g>`})}
  s+=`</svg>`;document.getElementById('chart').innerHTML=s;
  const centerText=[...defined].join(', ')||'нет';const channelText=chans.map(c=>c.name?`${c.key} — ${c.name}`:c.key).join(' · ')||'нет';document.getElementById('meta').textContent=`Определённые центры: ${centerText}. Каналы: ${channelText}.`;
 }catch(err){console.error(err);showError('Ошибка отрисовки BodyGraph: '+(err?.message||err))}
}
function centerColor(name){return({sacral:'#ef9b32',solarplexus:'#ef9b32',root:'#ef9b32',throat:'#55bfd0',ajna:'#b9d66d',g:'#fff',heart:'#fff',spleen:'#fff',head:'#fff'})[name]||'#fff'}
function centerShape(p,fill){const{x,y,w,h,type}=p;let d='';if(type==='head')d=`M ${x} ${y-h/2} L ${x+w/2} ${y} L ${x} ${y+h/2} L ${x-w/2} ${y} Z`;else if(type==='tri')d=`M ${x} ${y-h/2} L ${x+w/2} ${y+h/3} L ${x-w/2} ${y+h/3} Z`;else if(type==='throat')d=`M ${x-w/2} ${y-h/3} L ${x+w/2} ${y-h/3} L ${x+w/2*.9} ${y+h/4} L ${x} ${y+h/2} L ${x-w/2*.9} ${y+h/4} Z`;else if(type==='diamond')d=`M ${x} ${y-h/2} L ${x+w/2} ${y} L ${x} ${y+h/2} L ${x-w/2} ${y} Z`;else if(type==='circle')return`<ellipse cx="${x}" cy="${y}" rx="${w/2}" ry="${h/2}" fill="${fill}" stroke="#b9bfca" stroke-width="3"/>`;else if(type==='sacral')d=`M ${x-w*.38} ${y-h/3} Q ${x} ${y-h/2} ${x+w*.38} ${y-h/3} L ${x+w*.45} ${y+h/3} L ${x} ${y+h/2} L ${x-w*.45} ${y+h/3} Z`;else d=`M ${x-w/2} ${y-h/3} L ${x+w/2} ${y-h/3} L ${x+w*.42} ${y+h/3} L ${x} ${y+h/2} L ${x-w*.42} ${y+h/3} Z`;return`<path d="${d}" fill="${fill}" stroke="#b9bfca" stroke-width="3"/>`}
function sideColumn(arr,x,color,side){const list=Array.isArray(arr)?arr:[];const grouped={};for(const a of list){if(!a?.body)continue;(grouped[a.body]??=[]).push(a)}let s='';PLANET_ORDER.forEach((body,i)=>{const a=grouped[body]?.[0];if(!a)return;const y=150+i*56;const tx=side==='left'?x+42:x-42;s+=`<circle cx="${x}" cy="${y}" r="19" fill="${color}"/><text x="${x}" y="${y+1}" text-anchor="middle" dominant-baseline="middle" fill="#fff" class="planet">${PLANET_SYMBOL[body]||'•'}</text><text x="${tx}" y="${y+6}" text-anchor="${side==='left'?'start':'end'}" fill="${color}" font-size="17" font-weight="700">${a.gate}.${a.line}${a.retrograde?' ▼':''}</text>`});return s}
</script>
</body>
</html>
