function draw(data){const hd=data.humanDesign||{}, defined=new Set(hd.definedCenters||[]), active=new Set((hd.activatedGates||[]).map(Number)), chans=normalizeChannels(hd.definedChannels); document.getElementById('type').textContent=hd.type||'—';document.getElementById('authority').textContent=hd.authority||'—';document.getElementById('profile').textContent=hd.profile||'—';
