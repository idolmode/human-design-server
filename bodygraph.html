<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Human Design BodyGraph</title>
  <style>
    * { box-sizing: border-box; }
    body { margin: 0; padding: 24px; background: #fafafa; font-family: Arial, sans-serif; color: #222; }
    .container { max-width: 960px; margin: 0 auto; text-align: center; }
    h1 { font-size: 26px; margin: 0 0 8px; }
    .birth { color: #777; font-size: 13px; margin-bottom: 18px; word-break: break-word; }
    #chart { width: 100%; max-width: 720px; margin: 0 auto; min-height: 760px; }
    #chart svg { width: 100%; height: auto; display: block; }
    .info { margin-top: 18px; display: flex; justify-content: center; gap: 12px; flex-wrap: wrap; }
    .card { padding: 13px 20px; border-radius: 12px; background: #fff; box-shadow: 0 2px 12px rgba(0,0,0,.06); min-width: 150px; }
    .label { font-size: 12px; color: #777; margin-bottom: 5px; }
    .value { font-size: 18px; font-weight: bold; }
    .meta { margin-top: 18px; color: #666; font-size: 13px; line-height: 1.5; }
    .error { color: #b42318; background: #fff0ee; padding: 14px; border-radius: 10px; }
    .defined { fill: #e85d75; stroke: #333; stroke-width: 2; }
    .undefined { fill: #fff; stroke: #777; stroke-width: 2; }
    .channel { stroke: #555; stroke-width: 10; stroke-linecap: round; opacity: .95; }
    .gate { font-size: 11px; font-weight: bold; fill: #222; }
    .center-name { font-size: 12px; font-weight: 600; fill: #333; }
    .gate-ring { fill: #fff; stroke: #bbb; stroke-width: 1; }
    .channel-label { font-size: 10px; fill: #555; }
  </style>
</head>
<body>
<div class="container">
  <h1>Ваш BodyGraph</h1>
  <div id="birth" class="birth"></div>
  <div id="chart">Загрузка...</div>
  <div class="info">
    <div class="card"><div class="label">Тип</div><div class="value" id="type">—</div></div>
    <div class="card"><div class="label">Авторитет</div><div class="value" id="authority">—</div></div>
    <div class="card"><div class="label">Профиль</div><div class="value" id="profile">—</div></div>
  </div>
  <div id="meta" class="meta"></div>
</div>
<script>
const params = new URLSearchParams(window.location.search);
const date = params.get("date");
const time = params.get("time");
const timezone = params.get("timezone");

if (!date || !time || !timezone) {
  showError("Необходимо указать date, time и timezone в URL.");
} else {
  document.getElementById("birth").textContent = `${date} ${time} · ${timezone}`;
  const api = "/api/chart?date=" + encodeURIComponent(date) + "&time=" + encodeURIComponent(time) + "&timezone=" + encodeURIComponent(timezone);
  fetch(api)
    .then(async response => {
      const data = await response.json().catch(() => ({}));
      if (!response.ok) throw new Error(data.error || "Ошибка API");
      return data;
    })
    .then(drawBodyGraph)
    .catch(error => {
      console.error(error);
      showError("Не удалось загрузить карту: " + error.message);
    });
}

function showError(message) {
  document.getElementById("chart").innerHTML = `<div class="error">${escapeHtml(message)}</div>`;
}

function escapeHtml(value) {
  return String(value ?? "").replace(/[&<>\"]/g, ch => ({"&":"&amp;","<":"&lt;",">":"&gt;","\"":"&quot;"}[ch]));
}

function drawBodyGraph(data) {
  const hd = data.humanDesign || {};
  document.getElementById("type").textContent = hd.type || "—";
  document.getElementById("authority").textContent = hd.authority || "—";
  document.getElementById("profile").textContent = hd.profile || "—";

  const defined = new Set(hd.definedCenters || []);
  const channels = hd.definedChannels || [];
  const gates = [...new Set(hd.activatedGates || [])];

  const centers = {
    head:        { x: 300, y: 70,  points: "270,40 330,40 350,80 300,105 250,80" },
    ajna:        { x: 300, y: 150, points: "260,120 340,120 350,170 300,195 250,170" },
    throat:      { x: 300, y: 245, points: "260,210 340,210 350,265 300,295 250,265" },
    g:           { x: 300, y: 365, points: "260,325 340,325 350,380 300,410 250,380" },
    heart:       { x: 205, y: 450, points: "170,420 240,420 255,470 205,500 155,470" },
    spleen:      { x: 120, y: 545, points: "85,515 155,515 170,565 120,595 70,565" },
    solarplexus: { x: 390, y: 545, points: "355,515 425,515 440,565 390,595 340,565" },
    sacral:      { x: 300, y: 535, points: "260,500 340,500 355,550 300,580 245,550" },
    root:        { x: 300, y: 650, points: "260,615 340,615 355,665 300,695 245,665" }
  };

  let svg = `<svg viewBox="0 0 600 760" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Human Design BodyGraph">`;

  // Draw every returned defined channel, using the centers supplied by the API.
  for (const channel of channels) {
    const names = channel.centers || [];
    if (names.length !== 2 || !centers[names[0]] || !centers[names[1]]) continue;
    const a = centers[names[0]], b = centers[names[1]];
    svg += `<line x1="${a.x}" y1="${a.y}" x2="${b.x}" y2="${b.y}" class="channel" />`;
  }

  // Centers.
  for (const [name, center] of Object.entries(centers)) {
    const isDefined = defined.has(name);
    svg += `<polygon points="${center.points}" class="${isDefined ? "defined" : "undefined"}" />`;
    svg += `<text x="${center.x}" y="${center.y}" text-anchor="middle" dominant-baseline="middle" class="center-name">${escapeHtml(name)}</text>`;
  }

  // Activated gates around the bodygraph. The API returns the gate numbers, so render all of them.
  const ringRadius = 255;
  const centerX = 300, centerY = 370;
  gates.forEach((gate, index) => {
    const angle = -Math.PI / 2 + (index / Math.max(gates.length, 1)) * Math.PI * 2;
    const x = centerX + Math.cos(angle) * ringRadius;
    const y = centerY + Math.sin(angle) * ringRadius;
    svg += `<circle cx="${x}" cy="${y}" r="12" class="gate-ring" />`;
    svg += `<text x="${x}" y="${y}" text-anchor="middle" dominant-baseline="middle" class="gate">${escapeHtml(gate)}</text>`;
  });

  svg += `</svg>`;
  document.getElementById("chart").innerHTML = svg;

  const definedChannels = channels.map(c => c.name ? `${c.key} — ${c.name}` : c.key).join(" · ");
  document.getElementById("meta").textContent =
    `Определённые центры: ${[...defined].join(", ") || "нет"}. ` +
    `Каналы: ${definedChannels || "нет"}.`;
}
</script>
</body>
</html>
