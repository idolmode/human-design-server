<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Human Design BodyGraph</title>
<style>
*{box-sizing:border-box}html,body{margin:0;background:#fff;color:#151515;font-family:Arial,Helvetica,sans-serif}body{min-width:320px}.page{max-width:1540px;margin:0 auto;padding:18px 22px 42px}.top{display:grid;grid-template-columns:250px 1fr 250px;align-items:start;gap:18px}.side-title{font-size:30px;font-weight:800;line-height:1}.side-sub{font-size:16px;margin-top:6px}.design{color:#e31e2f}.personality{color:#111;text-align:right}.title{text-align:center}.title h1{margin:0;font-size:30px}.birth{color:#68758b;font-size:14px;margin-top:6px}.chart-wrap{margin:6px auto 0;max-width:1450px}.chart-wrap svg{display:block;width:100%;height:auto}.info{display:grid;grid-template-columns:repeat(3,1fr);max-width:880px;margin:12px auto 0;border:1px solid #dce2ea;border-radius:18px;overflow:hidden}.card{text-align:center;padding:14px 18px;border-right:1px solid #dce2ea}.card:last-child{border-right:0}.label{color:#748096;font-size:13px}.value{font-size:20px;font-weight:800;margin-top:5px}.meta{text-align:center;color:#68758b;font-size:13px;margin:10px auto 0;line-height:1.5}.loading{text-align:center;padding:120px 20px;color:#718096}.error{max-width:760px;margin:70px auto;padding:18px 20px;background:#fff0f0;border:1px solid #ffd0d0;border-radius:12px;color:#9f1d2b}.legend{font-size:11px;fill:#8a94a6}.planet{font-size:18px;font-weight:700}.gate{font-size:12px}.gate.active{font-weight:800}.center-label{font-size:12px;font-weight:800;fill:#3a3f48;letter-spacing:.3px}.mini{font-size:11px;fill:#68758b}@media(max-width:900px){.top{grid-template-columns:1fr;text-align:center}.design,.personality{text-align:center}.side-title{font-size:22px}.side-sub{font-size:13px}.info{grid-template-columns:1fr}.card{border-right:0;border-bottom:1px solid #dce2ea}.card:last-child{border-bottom:0}}
</style>
</head>
<body>
<main class="page">
  <div class="top">
    <div><div class="side-title design">DESIGN</div><div class="side-sub design">The Unconscious</div></div>
    <div class="title"><h1>Ваш BodyGraph</h1><div class="birth" id="birth"></div></div>
    <div><div class="side-title personality">PERSONALITY</div><div class="side-sub personality">The Conscious</div></div>
  </div>
  <div id="chart" class="chart-wrap"><div class="loading">Загрузка...</div></div>
  <div class="info">
    <div class="card"><div class="label">Тип</div><div class="value" id="type">—</div></div>
    <div class="card"><div class="label">Авторитет</div><div class="value" id="authority">—</div></div>
    <div class="card"><div class="label">Профиль</div><div class="value" id="profile">—</div></div>
  </div>
  <div id="meta" class="meta"></div>
</main>
<script>
const params=new URLSearchParams(location.search);
const date=params.get('date'), time=params.get('time'), timezone=params.get('timezone');
if(!date||!time||!timezone){showError('Необходимо указать date, time и timezone в URL.');}
else{
  document.getElementById('birth').textContent=`${date} ${time} · ${timezone}`;
  fetch(`/api/chart?date=${encodeURIComponent(date)}&time=${encodeURIComponent(time)}&timezone=${encodeURIComponent(timezone)}`)
    .then(async r=>{const d=await r.json().catch(()=>({}));if(!r.ok)throw new Error(d.error||'Ошибка API');return d})
    .then(draw).catch(e=>showError('Не удалось загрузить карту: '+e.message));
}
function showError(s){document.getElementById('chart').innerHTML=`<div class="error">${esc(s)}</div>`}
function esc(s){return String(s??'').replace(/[&<>\"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;','\\':'&#92;'}[c]))}

const CENTER_ORDER=['head','ajna','throat','g','heart','spleen','sacral','solarplexus','root'];
const CENTER_GATES={
 head:[64,61,63], ajna:[47,24,4,17,11,43], throat:[62,23,56,16,35,12,45,8,31,33,20],
 g:[1,7,13,25,10,15,2,46], heart:[21,26,40,51],
 spleen:[48,57,44,50,32,28,18], sacral:[5,14,29,34,9,59,3,27,42],
 solarplexus:[6,37,22,36,49,55,30], root:[53,60,52,19,39,41,38,54,58]
};
const CENTER_NAMES={head:'ГОЛОВА',ajna:'АДЖНА',throat:'ГОРЛО',g:'G',heart:'ЭГО',spleen:'СЕЛЕЗЁНКА',sacral:'САКРАЛ',solarplexus:'СОЛНЕЧНОЕ СПЛЕТЕНИЕ',root:'КОРЕНЬ'};
const CENTER_POS={
 head:{x:730,y:150,w:170,h:110,type:'head'}, ajna:{x:730,y:295,w:205,h:125,type:'tri'}, throat:{x:730,y:455,w:225,h:145,type:'throat'},
 g:{x:730,y:635,w:210,h:155,type:'diamond'}, heart:{x:570,y:770,w:150,h:115,type:'circle'}, spleen:{x:430,y:880,w:165,h:155,type:'tri'},
 sacral:{x:730,y:885,w:220,h:175,type:'sacral'}, solarplexus:{x:1000,y:885,w:190,h:160,type:'tri'}, root:{x:730,y:1080,w:220,h:145,type:'root'}
};
const GATE_ANCHORS={
 head:[[690,132],[730,115],[770,132]],
 ajna:[[680,280],[720,270],[760,280],[695,325],[730,345],[765,325]],
 throat:[[650,425],[690,415],[730,430],[770,415],[810,425],[675,485],[710,500],[750,500],[790,485],[720,465],[760,465]],
 g:[[665,600],[705,590],[750,600],[795,620],[675,660],[730,650],[785,660],[730,700]],
 heart:[[545,755],[570,785],[600,755],[615,805]],
 spleen:[[390,830],[420,850],[455,835],[390,885],[430,900],[465,880],[430,930]],
 sacral:[[665,830],[705,820],[750,830],[790,820],[825,840],[670,885],[705,920],[755,920],[800,890]],
 solarplexus:[[960,845],[995,830],[1030,850],[1070,830],[1110,850],[975,910],[1030,925],[1085,910]],
 root:[[665,1040],[705,1030],[750,1040],[795,1030],[825,1050],[675,1090],[710,1120],[755,1120],[800,1090]]
};
// Standard channel endpoints in the central graph. Only channels returned as defined are drawn.
const CHANNELS={
 '9-52':[[795,830],[795,1030]],
 '30-41':[[1085,910],[800,1090]],
};
const PLANET_SYMBOL={sun:'☉',earth:'⊕',moon:'☽',north_node:'☊',south_node:'☋',mercury:'☿',venus:'♀',mars:'♂',jupiter:'♃',saturn:'♄',uranus:'♅',neptune:'♆',pluto:'♇'};
const PLANET_ORDER=['sun','earth','north_node','south_node','moon','mercury','venus','mars','jupiter','saturn','uranus','neptune','pluto'];
function normalizeActivations(hd){
  const p=Array.isArray(hd.activations?.personality)?hd.activations.personality:[];
  const d=Array.isArray(hd.activations?.design)?hd.activations.design:[];
  return {personality:p,design:d};
}
function gateIsActive(hd,g){return new Set((hd.activatedGates||[]).map(Number)).has(Number(g));}
function definedChannelList(hd){return Array.isArray(hd.definedChannels)?hd.definedChannels.map(c=>typeof c==='string'?{key:c,name:''}:c).filter(c=>c&&c.key):[]}
function channelPoints(key){if(CHANNELS[key])return CHANNELS[key];const r=key.split('-').reverse().join('-');return CHANNELS[r]||null}
function fmtAct(a){return `${a.gate}.${a.line}`}
function draw(data){
  try{
    const hd=data?.humanDesign||{};
    const active=new Set((hd.activatedGates||[]).map(Number));
    const defined=new Set(hd.definedCenters||[]);
    const chans=definedChannelList(hd);
    const acts=normalizeActivations(hd);
    document.getElementById('type').textContent=hd.type||'—';
    document.getElementById('authority').textContent=hd.authority||'—';
    document.getElementById('profile').textContent=hd.profile||'—';

    let s=`<svg viewBox="0 0 1460 1240" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Human Design BodyGraph">`;
    s+=`<rect width="1460" height="1240" fill="#fff"/>`;
    // soft silhouette
    s+=`<path d="M515 75 Q730 5 945 75 Q870 140 890 255 Q1010 350 1045 545 L1090 780 Q1110 1010 960 1165 L500 1165 Q350 1010 370 780 L415 545 Q450 350 570 255 Q590 140 515 75Z" fill="#eef1f7"/>`;
    // inner torso guide rings
    s+=`<ellipse cx="730" cy="720" rx="330" ry="400" fill="none" stroke="#fff" stroke-width="13"/><ellipse cx="730" cy="720" rx="285" ry="355" fill="none" stroke="#fff" stroke-width="8"/>`;

    // side activation columns
    s+=sideColumn(acts.design,70, '#df2637', 'left');
    s+=sideColumn(acts.personality,1390, '#111', 'right');

    // arrows + bodygraph side labels
    s+=`<g font-family="Arial,Helvetica,sans-serif"><text x="270" y="125" fill="#df2637" font-size="26" font-weight="700">L</text><path d="M315 118 H390" stroke="#df2637" stroke-width="16"/><path d="M315 118 l22 -18 v36z" fill="#df2637"/><text x="1190" y="125" fill="#111" font-size="26" font-weight="700">R</text><path d="M1070 118 H1145" stroke="#111" stroke-width="16"/><path d="M1145 118 l-22 -18 v36z" fill="#111"/></g>`;

    // channels first, then centers, then gates: guarantees no gate overlaps channel lines.
    for(const c of chans){const pts=channelPoints(c.key);if(!pts)continue;const [a,b]=pts;const g1=Number((c.gates||[])[0]),g2=Number((c.gates||[])[1]);const red=active.has(g1)&&active.has(g2);s+=`<line x1="${a[0]}" y1="${a[1]}" x2="${b[0]}" y2="${b[1]}" stroke="#ffffff" stroke-width="28" stroke-linecap="round"/><line x1="${a[0]}" y1="${a[1]}" x2="${b[0]}" y2="${b[1]}" stroke="${red?'#e31e2f':'#111'}" stroke-width="14" stroke-linecap="round"/>`;}

    // centers
    for(const name of CENTER_ORDER){const p=CENTER_POS[name];const fill=defined.has(name)?centerColor(name):'#fff';s+=centerShape(p,fill);}
    // center labels
    for(const name of CENTER_ORDER){const p=CENTER_POS[name];s+=`<text x="${p.x}" y="${p.y+4}" text-anchor="middle" dominant-baseline="middle" class="center-label">${CENTER_NAMES[name]}</text>`;}

    // gates: all standard gates are visible; active gates are purple badges. This mirrors the reference and keeps every number anchored to a fixed slot.
    for(const name of CENTER_ORDER){const gates=CENTER_GATES[name], slots=GATE_ANCHORS[name];gates.forEach((g,i)=>{const q=slots[i];const on=active.has(g);s+=`<g><circle cx="${q[0]}" cy="${q[1]}" r="${on?16:12}" fill="${on?'#6d3b95':'#fff'}" stroke="${on?'#6d3b95':'#aeb6c2'}" stroke-width="${on?1:1.5}"/><text x="${q[0]}" y="${q[1]+1}" text-anchor="middle" dominant-baseline="middle" class="gate" fill="${on?'#fff':'#2e3440'}">${g}</text></g>`;});}

    // channel labels, placed away from gate slots
    for(const c of chans){const pts=channelPoints(c.key);if(!pts)continue;const mx=(pts[0][0]+pts[1][0])/2,my=(pts[0][1]+pts[1][1])/2;s+=`<text x="${mx+22}" y="${my}" class="mini" font-weight="700">${esc(c.key)}${c.name?` · ${esc(c.name)}`:''}</text>`;}

    s+=`</svg>`;
    document.getElementById('chart').innerHTML=s;
    const centerText=[...defined].join(', ')||'нет';
    const channelText=chans.map(c=>c.name?`${c.key} — ${c.name}`:c.key).join(' · ')||'нет';
    document.getElementById('meta').textContent=`Определённые центры: ${centerText}. Каналы: ${channelText}.`;
  }catch(err){console.error(err);showError('Ошибка отрисовки BodyGraph: '+(err?.message||err));}
}
function centerColor(name){return ({sacral:'#ef9b32',solarplexus:'#ef9b32',root:'#ef9b32',throat:'#58c1cf',ajna:'#b9d66d',g:'#fff',heart:'#fff',spleen:'#fff',head:'#fff'})[name]||'#fff'}
function centerShape(p,fill){
  const x=p.x,y=p.y,w=p.w,h=p.h;let d='';
  if(p.type==='head')d=`M ${x} ${y-h/2} L ${x+w/2} ${y} L ${x} ${y+h/2} L ${x-w/2} ${y} Z`;
  else if(p.type==='tri')d=`M ${x} ${y-h/2} L ${x+w/2} ${y+h/3} L ${x-w/2} ${y+h/3} Z`;
  else if(p.type==='throat')d=`M ${x-w/2} ${y-h/3} L ${x+w/2} ${y-h/3} L ${x+w/2*.9} ${y+h/4} L ${x} ${y+h/2} L ${x-w/2*.9} ${y+h/4} Z`;
  else if(p.type==='diamond')d=`M ${x} ${y-h/2} L ${x+w/2} ${y} L ${x} ${y+h/2} L ${x-w/2} ${y} Z`;
  else if(p.type==='circle')return `<ellipse cx="${x}" cy="${y}" rx="${w/2}" ry="${h/2}" fill="${fill}" stroke="#b9bfca" stroke-width="3"/>`;
  else if(p.type==='sacral')d=`M ${x-w/2*.75} ${y-h/3} Q ${x} ${y-h/2} ${x+w/2*.75} ${y-h/3} L ${x+w/2*.9} ${y+h/3} L ${x} ${y+h/2} L ${x-w/2*.9} ${y+h/3} Z`;
  else d=`M ${x-w/2} ${y-h/3} L ${x+w/2} ${y-h/3} L ${x+w/2*.85} ${y+h/3} L ${x} ${y+h/2} L ${x-w/2*.85} ${y+h/3} Z`;
  return `<path d="${d}" fill="${fill}" stroke="#b9bfca" stroke-width="3"/>`;
}
function sideColumn(arr,x,color,side){
  const list=Array.isArray(arr)?arr:[];let s='';const grouped={};for(const a of list){if(!a?.body)continue;(grouped[a.body]??=[]).push(a)}
  PLANET_ORDER.forEach((body,i)=>{const a=grouped[body]?.[0];if(!a)return;const y=175+i*69;const anchor=side==='left'?'start':'end';const tx=side==='left'?x+43:x-43;s+=`<circle cx="${x}" cy="${y}" r="22" fill="${color}"/><text x="${x}" y="${y+1}" text-anchor="middle" dominant-baseline="middle" fill="#fff" class="planet">${PLANET_SYMBOL[body]||'•'}</text><text x="${tx}" y="${y+7}" text-anchor="${anchor}" fill="${color}" font-size="20" font-weight="700">${a.gate}.${a.line}</text>`});return s}
</script>
</body>
</html>
