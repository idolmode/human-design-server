<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Human Design BodyGraph</title>
<style>
*{box-sizing:border-box}html,body{margin:0;background:#fff;color:#151515;font-family:Arial,Helvetica,sans-serif}body{min-width:320px}.page{max-width:1500px;margin:0 auto;padding:14px 18px 34px}.top{display:grid;grid-template-columns:330px 1fr 330px;align-items:start;gap:10px}.side-title{font-size:30px;font-weight:800;line-height:1}.side-sub{font-size:14px;margin-top:5px}.design{color:#df2637}.personality{color:#111;text-align:right}.title{text-align:center}.title h1{margin:0;font-size:27px}.birth{color:#68758b;font-size:12px;margin-top:5px}.chart-wrap{margin:2px auto 0;max-width:1386px}.chart-wrap svg{display:block;width:100%;height:auto}.info{display:grid;grid-template-columns:repeat(3,1fr);max-width:900px;margin:8px auto 0;border:1px solid #dce2ea;border-radius:16px;overflow:hidden}.card{text-align:center;padding:12px 16px;border-right:1px solid #dce2ea}.card:last-child{border-right:0}.label{color:#748096;font-size:11px}.value{font-size:18px;font-weight:800;margin-top:4px}.meta{text-align:center;color:#68758b;font-size:11px;margin:8px auto 0;line-height:1.4}.loading{text-align:center;padding:100px 20px;color:#718096}.error{max-width:760px;margin:60px auto;padding:18px 20px;background:#fff0f0;border:1px solid #ffd0d0;border-radius:12px;color:#9f1d2b}.planet{font-size:16px;font-weight:700}.gate{font-size:11px}.center-label{font-size:12px;font-weight:800;fill:#303642;letter-spacing:.2px}.mini{font-size:10px;fill:#657186}@media(max-width:900px){.top{grid-template-columns:1fr;text-align:center}.design,.personality{text-align:center}.side-title{font-size:22px}.side-sub{font-size:12px}.info{grid-template-columns:1fr}.card{border-right:0;border-bottom:1px solid #dce2ea}.card:last-child{border-bottom:0}}
.top{grid-template-columns:1fr}.chart-wrap{max-width:780px}.chart-wrap svg{background:#f3f3f6;border-radius:18px}</style>
</head>
<body>
<main class="page">
  <div class="top">
    <div class="title"><h1>Ваш BodyGraph</h1><div class="birth" id="birth"></div></div>
    </div>
  <div id="chart" class="chart-wrap"><div class="loading">Загрузка...</div></div>
  <div class="info">
    <div class="card"><div class="label">Тип</div><div class="value" id="type">—</div></div>
    <div class="card"><div class="label">Авторитет</div><div class="value" id="authority">—</div></div>
    <div class="card"><div class="label">Профиль</div><div class="value" id="profile">—</div></div>
  </div>
  <div id="meta" class="meta"></div>
</main>
<script>
const params=new URLSearchParams(location.search);
const date=params.get('date'),time=params.get('time'),timezone=params.get('timezone');
if(!date||!time||!timezone)showError('Необходимо указать date, time и timezone в URL.');
else{document.getElementById('birth').textContent=`${date} ${time} · ${timezone}`;fetch(`/api/chart?date=${encodeURIComponent(date)}&time=${encodeURIComponent(time)}&timezone=${encodeURIComponent(timezone)}`).then(async r=>{const d=await r.json().catch(()=>({}));if(!r.ok)throw new Error(d.error||'Ошибка API');return d}).then(draw).catch(e=>showError('Не удалось загрузить карту: '+e.message));}
function showError(s){document.getElementById('chart').innerHTML=`<div class="error">${esc(s)}</div>`}
function esc(s){return String(s??'').replace(/[&<>\"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;','\\':'&#92;'}[c]))}


// ---- Новая отрисовка: силуэт, белая сеть каналов, колонки планет ----
const CENTER_ORDER=['head','ajna','throat','g','heart','spleen','sacral','solarplexus','root'];
const CENTER_GATES={head:[64,61,63],ajna:[47,24,4,17,11,43],throat:[62,23,56,16,35,20,12,45,31,8,33],g:[1,7,13,25,10,15,46,2],heart:[51,21,40,26],spleen:[48,57,44,50,32,18,28],solarplexus:[36,22,37,6,49,55,30],sacral:[34,14,29,5,27,3,42,59,9],root:[53,60,52,19,54,39,38,41,58]};
const GATE_XY={64:[326,121],61:[340,121],63:[355,121],47:[326,158],24:[340,158],4:[355,158],17:[332,180],11:[350,180],43:[340,196],
62:[320,238],23:[340,238],56:[358,238],16:[317,250],35:[364,250],20:[314,262],12:[366,262],45:[364,274],31:[320,287],8:[340,287],33:[360,287],
1:[340,330],7:[327,343],13:[355,343],10:[310,360],25:[365,361],15:[318,378],46:[362,378],2:[340,391],
51:[402,404],21:[416,408],40:[400,430],26:[388,420],
48:[210,442],57:[222,452],44:[235,462],50:[250,468],32:[235,477],18:[210,493],28:[222,485],
36:[470,441],22:[455,452],37:[442,460],6:[432,468],49:[445,477],55:[458,485],30:[470,493],
34:[318,460],14:[340,445],29:[356,448],5:[340,472],27:[318,487],3:[340,497],42:[327,497],59:[365,487],9:[355,497],
53:[322,536],60:[340,536],52:[356,536],19:[364,548],54:[320,548],39:[364,562],38:[320,562],41:[364,576],58:[320,576]};
// 36 каналов; число после пары — изгиб линии в пикселях
const CHANNELS=['1-8','2-14','3-60','4-63','5-15','6-59','7-31','9-52','10-20','10-34','10-57','11-56','12-22','13-33','16-48','17-62','18-58:-14','19-49:-20','20-34:40','20-57:20','21-45','23-43','24-61','25-51','26-44','27-50','28-38:-12','29-46','30-41:30','32-54:-12','34-57','35-36','37-40','39-55:20','42-53','47-64'];
const PLANET_SYMBOL={sun:'☉',earth:'⊕',moon:'☽',north_node:'☊',south_node:'☋',mercury:'☿',venus:'♀',mars:'♂',jupiter:'♃',saturn:'♄',uranus:'♅',neptune:'♆',pluto:'♇'};
const PLANET_ORDER=['sun','earth','north_node','south_node','moon','mercury','venus','mars','jupiter','saturn','uranus','neptune','pluto'];
const RED='#e8202f',INK='#111',ORANGE='#f29a4a',EDGE='#c9c9d4';
function normalizeActivations(hd){return{personality:Array.isArray(hd.activations?.personality)?hd.activations.personality:[],design:Array.isArray(hd.activations?.design)?hd.activations.design:[]}}
function normalizeKey(k){return String(k||'').replace(/\s+/g,'').replace(/[–—]/g,'-')}
function chanKeyNorm(k){const[a,b]=normalizeKey(k).split('-').map(Number);return a<b?`${a}-${b}`:`${b}-${a}`}
function pt(a,b){return[(a[0]+b[0])/2,(a[1]+b[1])/2]}
// каналы: две половины (от каждых ворот до середины), чтобы раскрасить их по Design/Personality
function chanHalves(g1,g2,bend){const P0=GATE_XY[g1],P2=GATE_XY[g2];const dx=P2[0]-P0[0],dy=P2[1]-P0[1],L=Math.hypot(dx,dy)||1;const m=pt(P0,P2);const C=[m[0]-dy/L*bend,m[1]+dx/L*bend];const B=[(P0[0]+2*C[0]+P2[0])/4,(P0[1]+2*C[1]+P2[1])/4];const f=p=>p[0].toFixed(1)+' '+p[1].toFixed(1);const c1=pt(P0,C),c2=pt(C,P2);return{full:`M${f(P0)}Q${f(C)} ${f(P2)}`,h1:`M${f(P0)}Q${f(c1)} ${f(B)}`,h2:`M${f(P2)}Q${f(c2)} ${f(B)}`}}
function strokeBy(d,inD,inP){if(inD&&inP)return`<path d="${d}" fill="none" stroke="${INK}" stroke-width="6"/><path d="${d}" fill="none" stroke="${RED}" stroke-width="6" stroke-dasharray="7 7"/>`;return`<path d="${d}" fill="none" stroke="${inD?RED:INK}" stroke-width="6"/>`}
function centerShape(n,f){const a=`fill="${f}" stroke="${EDGE}" stroke-width="1.5"`;return({
 head:`<polygon points="340,82 298,144 382,144" ${a}/>`,ajna:`<polygon points="298,152 382,152 340,212" ${a}/>`,
 throat:`<rect x="303" y="225" width="74" height="68" rx="8" ${a}/>`,g:`<polygon points="340,322 378,359 340,397 302,359" ${a}/>`,
 heart:`<circle cx="400" cy="415" r="26" ${a}/>`,spleen:`<polygon points="196,436 272,468 196,502" ${a}/>`,
 solarplexus:`<polygon points="484,436 408,468 484,502" ${a}/>`,sacral:`<circle cx="340" cy="468" r="36" ${a}/>`,root:`<rect x="312" y="526" width="62" height="62" rx="6" ${a}/>`})[n]}
function arrow(x1,x2,y,left,c){const a=left?[x2,x1]:[x1,x2];const t=left?x1:x2,b=left?x2:x1;return`<path d="M${b} ${y-8}H${left?x1+16:x2-16}V${y-14}L${t} ${y}L${left?x1+16:x2-16} ${y+14}V${y+8}H${b}Z" fill="${c}"/>`}
function column(arr,side){const list=Array.isArray(arr)?arr:[];const by={};for(const a of list){if(a?.body&&!by[a.body])by[a.body]=a}let s='';const left=side==='left',c=left?RED:INK;
 PLANET_ORDER.forEach((body,i)=>{const a=by[body];if(!a)return;const y=127+i*37.9,cx=left?76:606;const v=`${a.gate}.${a.line}`;
  s+=`<circle cx="${cx}" cy="${y}" r="14" fill="${c}"/><text x="${cx}" y="${y+6}" text-anchor="middle" fill="#fff" font-size="17">${PLANET_SYMBOL[body]||'•'}</text>`;
  s+=left?`<text x="101" y="${y+6}" fill="${c}" font-size="15" font-weight="600">${v}${a.retrograde?' ▼':''}</text>`:`<text x="578" y="${y+6}" text-anchor="end" fill="${c}" font-size="15" font-weight="600">${a.retrograde?'▼ ':''}${v}</text>`});return s}
function draw(data){
 try{
  const hd=data?.humanDesign||{};const active=new Set((hd.activatedGates||[]).map(Number));const defined=new Set(hd.definedCenters||[]);const acts=normalizeActivations(hd);
  const dSet=new Set(acts.design.map(a=>Number(a.gate))),pSet=new Set(acts.personality.map(a=>Number(a.gate)));
  const chans=Array.isArray(hd.definedChannels)?hd.definedChannels.map(c=>typeof c==='string'?{key:c,name:''}:c).filter(c=>c&&c.key):[];
  const defKeys=new Set(chans.map(c=>chanKeyNorm(c.key||c.channel||c.name)));
  document.getElementById('type').textContent=hd.type||'—';document.getElementById('authority').textContent=hd.authority||'—';document.getElementById('profile').textContent=hd.profile||'—';
  const flag=g=>({d:dSet.has(g),p:pSet.has(g)||(!dSet.has(g)&&!pSet.has(g))});
  let s=`<svg viewBox="30 50 620 570" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Human Design BodyGraph" font-family="Montserrat,Arial,Helvetica,sans-serif">`;
  s+=`<text x="60" y="77" fill="${RED}" font-size="16" font-weight="800">DESIGN</text><text x="60" y="95" fill="${RED}" font-size="10">The Unconscious</text><text x="620" y="77" fill="${INK}" font-size="16" font-weight="800" text-anchor="end">PERSONALITY</text><text x="620" y="95" fill="${INK}" font-size="10" text-anchor="end">The Conscious</text>`;
  s+=`<path d="M290 120C290 80 318 62 340 62C364 62 392 80 392 120C392 150 380 168 388 186L440 204C500 226 510 290 515 360L520 610H160L165 360C170 290 180 226 240 204L292 186C300 168 290 150 290 120Z" fill="#dcdce6"/>`;
  const parsed=CHANNELS.map(c=>{const[k,b]=c.split(':');const[g1,g2]=k.split('-').map(Number);return{g1,g2,k:chanKeyNorm(k),h:chanHalves(g1,g2,Number(b||0))}});
  for(const c of parsed)s+=`<path d="${c.h.full}" fill="none" stroke="#fff" stroke-width="6" stroke-linecap="round"/>`;
  for(const c of parsed){if(!defKeys.has(c.k))continue;const f1=flag(c.g1),f2=flag(c.g2);s+=strokeBy(c.h.h1,f1.d,f1.p)+strokeBy(c.h.h2,f2.d,f2.p)}
  for(const n of CENTER_ORDER)s+=centerShape(n,defined.has(n)?ORANGE:'#fff');
  for(const n of CENTER_ORDER)for(const g of CENTER_GATES[n]){const[x,y]=GATE_XY[g];if(active.has(g))s+=`<circle cx="${x}" cy="${y}" r="7.5" fill="#6a3d8f"/><text x="${x}" y="${y+2.6}" text-anchor="middle" fill="#fff" font-size="7" font-weight="700">${g}</text>`;else s+=`<text x="${x}" y="${y+2.6}" text-anchor="middle" fill="#222" font-size="8" font-weight="600">${g}</text>`}
  s+=`<text x="172" y="132" text-anchor="end" fill="${RED}" font-size="20" font-weight="800">L</text>${arrow(180,222,125,true,RED)}${arrow(458,500,125,false,INK)}<text x="508" y="132" fill="${INK}" font-size="20" font-weight="800">R</text>`;
  s+=column(acts.design,'left')+column(acts.personality,'right')+`</svg>`;
  document.getElementById('chart').innerHTML=s;
  const centerText=[...defined].join(', ')||'нет';const channelText=chans.map(c=>c.name?`${c.key} — ${c.name}`:c.key).join(' · ')||'нет';document.getElementById('meta').textContent=`Определённые центры: ${centerText}. Каналы: ${channelText}.`;
 }catch(err){console.error(err);showError('Ошибка отрисовки BodyGraph: '+(err?.message||err))}
}
</script>
</body>
</html>
